  ## 里程碑

  - **M1 (阶段 1 完成)**: 可以 CRUD Provider 和 Profile
  - **M2 (阶段 2 完成)**: 所有 CLI 命令可用
  - **M3 (阶段 3 完成)**: 可以激活 Profile 并配置工具
  - **M4 (阶段 4 完成)**: 所有测试通过，可以发布

