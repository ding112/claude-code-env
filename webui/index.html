<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCE - Claude Code 配置管理</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- 顶部状态栏 -->
    <header class="header">
      <div class="header-content">
        <h1>CCE 配置管理</h1>
        <div id="current-status" class="current-status">
          <span class="status-label">当前配置:</span>
          <span id="current-profile-name" class="status-value">-</span>
          <span id="current-profile-type" class="status-badge">-</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="refresh-btn" class="btn btn-secondary">刷新</button>
      </div>
    </header>

    <!-- 错误提示 -->
    <div id="error-toast" class="toast error hidden"></div>

    <!-- 成功提示 -->
    <div id="success-toast" class="toast success hidden"></div>

    <!-- 模板应用提示 -->
    <div id="info-toast" class="toast info hidden"></div>

    <!-- 主内容区 -->
    <main class="main">
      <!-- Tab 切换 -->
      <div class="tabs">
        <button class="tab active" data-tab="profiles">配置列表</button>
        <button class="tab" data-tab="providers">Providers</button>
      </div>

      <!-- Profiles 列表 -->
      <section id="profiles-section" class="section">
        <div class="section-header">
          <h2>配置列表</h2>
          <button id="create-btn" class="btn btn-primary">新建配置</button>
        </div>
        <div class="table-container">
          <table id="profiles-table" class="table">
            <thead>
              <tr>
                <th>名称</th>
                <th>Provider 类型</th>
                <th>Provider / 模型</th>
                <th>描述</th>
                <th>创建时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="profiles-tbody">
              <tr>
                <td colspan="6" class="loading-row">加载中...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- Providers 列表 -->
      <section id="providers-section" class="section hidden">
        <div class="section-header">
          <h2>Provider 列表</h2>
          <button id="create-provider-btn" class="btn btn-primary">新建 Provider</button>
        </div>
        <div class="table-container">
          <table id="providers-table" class="table">
            <thead>
              <tr>
                <th>名称</th>
                <th>类型</th>
                <th>来源</th>
                <th>Base URL</th>
                <th>模型数</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="providers-tbody">
              <tr>
                <td colspan="6" class="loading-row">加载中...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- Details Drawer -->
  <div id="details-drawer" class="drawer hidden">
    <div class="drawer-overlay"></div>
    <div class="drawer-content">
      <div class="drawer-header">
        <h2 id="details-title">配置详情</h2>
        <button id="close-details" class="btn-icon" title="关闭">×</button>
      </div>
      <div id="details-body" class="drawer-body"></div>
    </div>
  </div>

  <!-- Create Modal -->
  <div id="create-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2>新建配置</h2>
        <button id="close-create" class="btn-icon" title="关闭">×</button>
      </div>
      <div class="modal-body">
        <form id="create-form">
          <div class="form-group">
            <label for="create-name">配置名称 *</label>
            <input type="text" id="create-name" name="name" required pattern="[a-zA-Z0-9_-]+" placeholder="例如: work、home (字母、数字、下划线、连字符)">
          </div>

          <div class="form-group">
            <label for="create-description">描述</label>
            <input type="text" id="create-description" name="description" placeholder="例如: 工作配置">
          </div>

          <div class="form-group">
            <label for="create-provider">Provider *</label>
            <select id="create-provider" name="provider" required>
              <option value="">加载中...</option>
            </select>
          </div>

          <div class="form-group">
            <label for="create-model">模型 (可选，留空使用默认)</label>
            <input type="text" id="create-model" name="model" placeholder="选择 Provider 后可用">
          </div>

          <div class="fields-group">
            <h3>Claude Code 高级设置（可选）</h3>
            <div class="form-group">
              <label for="create-default-opus-model">默认 Opus 模型</label>
              <input type="text" id="create-default-opus-model" name="defaultOpusModel" placeholder="例如: claude-opus-4-20250514">
            </div>
            <div class="form-group">
              <label for="create-default-sonnet-model">默认 Sonnet 模型</label>
              <input type="text" id="create-default-sonnet-model" name="defaultSonnetModel" placeholder="例如: claude-sonnet-4-20250514">
            </div>
            <div class="form-group">
              <label for="create-default-haiku-model">默认 Haiku 模型</label>
              <input type="text" id="create-default-haiku-model" name="defaultHaikuModel" placeholder="例如: claude-3-5-haiku-20241022">
            </div>
            <div class="form-group">
              <label for="create-subagent-model">Subagent 模型</label>
              <input type="text" id="create-subagent-model" name="subagentModel" placeholder="例如: claude-sonnet-4-20250514">
            </div>
            <div class="form-group">
              <label for="create-effort-level">Effort Level</label>
              <select id="create-effort-level" name="effortLevel">
                <option value="">不设置</option>
                <option value="low">low</option>
                <option value="medium">medium</option>
                <option value="high">high</option>
                <option value="max">max</option>
              </select>
            </div>
          </div>

          <div class="form-group checkbox-group">
            <label>
              <input type="checkbox" id="create-use-now" name="use-now" checked>
              创建后立即启用此配置
            </label>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button id="create-cancel" class="btn btn-secondary">取消</button>
        <button id="create-submit" class="btn btn-primary">创建</button>
      </div>
    </div>
  </div>

  <!-- Provider Details Drawer -->
  <div id="provider-details-drawer" class="drawer hidden">
    <div class="drawer-overlay"></div>
    <div class="drawer-content">
      <div class="drawer-header">
        <h2 id="provider-details-title">Provider 详情</h2>
        <button id="close-provider-details" class="btn-icon" title="关闭">×</button>
      </div>
      <div id="provider-details-body" class="drawer-body"></div>
    </div>
  </div>

  <!-- Create/Edit Provider Modal -->
  <div id="provider-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="provider-modal-title">新建 Provider</h2>
        <button id="close-provider-modal" class="btn-icon" title="关闭">×</button>
      </div>
      <div class="modal-body">
        <form id="provider-form">
          <div class="form-group">
            <label for="provider-name">配置名称 *</label>
            <input type="text" id="provider-name" name="name" required placeholder="例如: my-openai">
            <small class="form-hint">创建后不可修改</small>
          </div>

          <div class="form-group">
            <label for="provider-display-name">显示名称</label>
            <input type="text" id="provider-display-name" name="displayName" placeholder="可选，留空则使用配置名称">
          </div>

          <div class="form-group">
            <label for="provider-source">来源 *</label>
            <select id="provider-source" name="source" required>
              <option value="">请选择来源</option>
            </select>
            <small class="form-hint">配置来源类型，用于 Claude Code 高级配置</small>
          </div>

          <div class="form-group">
            <label for="provider-type">类型 *</label>
            <select id="provider-type" name="type" required>
              <option value="">请选择类型</option>
              <option value="openai-compatible">OpenAI 接口协议</option>
              <option value="anthropic-compatible">Anthropic 接口协议</option>
              <option value="custom">自定义</option>
            </select>
          </div>

          <div class="form-group">
            <label for="provider-base-url">Base URL *</label>
            <input type="text" id="provider-base-url" name="baseURL" required placeholder="例如: https://api.openai.com/v1">
          </div>

          <div class="form-group">
            <label for="provider-api-key">API Key <span id="api-key-required-mark">*</span></label>
            <input type="password" id="provider-api-key" name="apiKey" required placeholder="输入 API Key">
          </div>

          <div class="form-group">
            <label for="provider-models">可用模型 * (逗号分隔)</label>
            <input type="text" id="provider-models" name="models" required placeholder="例如: gpt-4, gpt-3.5-turbo">
            <small class="form-hint">多个模型用逗号分隔，自动去除空格</small>
          </div>

          <div class="form-group">
            <label for="provider-default-model">默认模型 *</label>
            <select id="provider-default-model" name="defaultModel" required>
              <option value="">请先填写可用模型</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button id="provider-cancel" class="btn btn-secondary">取消</button>
        <button id="provider-submit" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <!-- Edit Profile Modal -->
  <div id="edit-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="edit-modal-title">编辑配置</h2>
        <button id="close-edit" class="btn-icon" title="关闭">×</button>
      </div>
      <div class="modal-body">
        <form id="edit-form">
          <div class="form-group">
            <label for="edit-name">配置名称 *</label>
            <input type="text" id="edit-name" name="name" required pattern="[a-zA-Z0-9_-]+" placeholder="例如: work、home">
          </div>

          <div class="form-group">
            <label for="edit-description">描述</label>
            <input type="text" id="edit-description" name="description" placeholder="例如: 工作配置">
          </div>

          <div class="form-group">
            <label for="edit-provider">Provider *</label>
            <select id="edit-provider" name="provider" required>
              <option value="">加载中...</option>
            </select>
          </div>

          <div class="form-group">
            <label for="edit-model">模型 (可选，留空使用默认)</label>
            <input type="text" id="edit-model" name="model" placeholder="选择 Provider 后可用">
          </div>

          <div class="fields-group">
            <h3>Claude Code 高级设置（可选）</h3>
            <div class="form-group">
              <label for="edit-default-opus-model">默认 Opus 模型</label>
              <input type="text" id="edit-default-opus-model" name="defaultOpusModel" placeholder="例如: claude-opus-4-20250514">
            </div>
            <div class="form-group">
              <label for="edit-default-sonnet-model">默认 Sonnet 模型</label>
              <input type="text" id="edit-default-sonnet-model" name="defaultSonnetModel" placeholder="例如: claude-sonnet-4-20250514">
            </div>
            <div class="form-group">
              <label for="edit-default-haiku-model">默认 Haiku 模型</label>
              <input type="text" id="edit-default-haiku-model" name="defaultHaikuModel" placeholder="例如: claude-3-5-haiku-20241022">
            </div>
            <div class="form-group">
              <label for="edit-subagent-model">Subagent 模型</label>
              <input type="text" id="edit-subagent-model" name="subagentModel" placeholder="例如: claude-sonnet-4-20250514">
            </div>
            <div class="form-group">
              <label for="edit-effort-level">Effort Level</label>
              <select id="edit-effort-level" name="effortLevel">
                <option value="">不设置</option>
                <option value="low">low</option>
                <option value="medium">medium</option>
                <option value="high">high</option>
                <option value="max">max</option>
              </select>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button id="edit-cancel" class="btn btn-secondary">取消</button>
        <button id="edit-submit" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
